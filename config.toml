# polybot configuration — the only settings file. No secrets: every endpoint
# used is public and read-only. There is no order-placement code in this project.

[general]
db_path = "data/paperbot.sqlite"
log_file = "data/paperbot.log"
log_level = "INFO"
user_agent = "polymarket-paperbot/0.1 (read-only research)"
http_timeout_s = 10.0

[endpoints]
gamma = "https://gamma-api.polymarket.com"
clob = "https://clob.polymarket.com"
market_ws = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
rtds_ws = "wss://ws-live-data.polymarket.com"          # Chainlink BTC/USD relay (resolution source)
coinbase_ws = "wss://ws-feed.exchange.coinbase.com"    # fast spot feed, US-accessible
coinbase_rest = "https://api.exchange.coinbase.com"    # 1-minute candles for vol warm-up

[markets]
discover_ahead_s = 120          # look up the next window this long before rollover
discover_retry_s = 5
unsubscribe_after_end_s = 20
gamma_heartbeat_s = 2           # light poll of the live market on Gamma (feeds the Gamma status dot)
subscribe_ahead_s = 15          # subscribe to a window's order books this long before it starts
# Never trade a window unless its description contains all of these:
required_description_terms = ["Chainlink", "greater than or equal"]

[[markets.series]]
name = "btc-15m"
slug_prefix = "btc-updown-15m"          # event slug = btc-updown-15m-<window start, unix s>
series_slug = "btc-up-or-down-15m"      # fallback discovery path
interval_s = 900
enabled = true

[[markets.series]]
name = "btc-5m"
slug_prefix = "btc-updown-5m"
series_slug = "btc-up-or-down-5m"
interval_s = 300
enabled = true

[resolution]
first_poll_after_end_s = 15
poll_s = 15                     # poll Gamma this often for the first hour after close
fast_window_s = 3600
slow_poll_s = 300               # then this often, until Polymarket posts it

[spot]
product_id = "BTC-USD"
price_source = "mid"            # "mid" (best bid/ask midpoint) or "last" trade
stale_s = 30                    # no fair value if Coinbase is quiet this long
history_s = 3600

[chainlink]
enabled = true
topic = "crypto_prices_chainlink"
symbol = "btc/usd"
ping_interval_s = 5
stale_s = 30
boundary_max_delay_s = 2        # start/end price = first Chainlink report at or up to this many s after the boundary
                                # (0 = exact timestamp only; too strict: reports rarely land on the exact second)

[polymarket_ws]
ping_interval_s = 10            # docs: send PING every 10 s
stale_s = 60
desync_resync_s = 5
custom_features = false         # extra best_bid_ask/new_market/market_resolved events (more traffic; not needed)

[model]
vol_lookback_min = 30           # N minutes of realized vol
vol_sample_s = 1.0
vol_min_live_s = 120
vol_bootstrap_candles = true    # seed vol from Coinbase 1-minute candles at startup
vol_floor_annual = 0.10
strike_source = "polymarket"    # S0 = Polymarket's published price to beat (Gamma eventMetadata.priceToBeat);
                                # until it appears, the Chainlink report at the window start. "chainlink" / "coinbase" also work
basis_correction = true         # S = Coinbase - EWMA(Coinbase - Chainlink)
basis_halflife_s = 120
basis_noise_bps = 0.0           # extra uncertainty for Coinbase/Chainlink gap; 0 = your exact formula

[fees]
source = "clob"                 # "clob" (/clob-markets fd), "gamma" (feeSchedule), or "fixed"
fixed_rate = 0.07               # fallback only
fixed_exponent = 1.0
round_decimals = 5
buy_fee_in = "collateral"       # V2 SDKs charge the buy fee in pUSD on top of notional

[strategy]
# Signal when the ask is below fair value by more than taker fee + slippage + buffer:
#   fair - VWAP(order size) - fee/share - slippage_allowance > safety_buffer
safety_buffer = 0.01            # $ per share (1 cent)
slippage_allowance = 0.0        # extra $/share on top of the book-walk slippage
min_seconds_remaining = 10      # no new entries in the last N seconds of a window
skip_log_interval_s = 5         # log at most one skipped opportunity per window+side this often

[sim]
starting_bankroll = 100.0
latency_ms = 300                # signal -> fill delay; fills use the book as it looks AFTER the delay
adverse_move = "take"           # book moved against us during latency: "take" the worse price or "skip"
max_slippage = 0.02             # order limit = signal ask + this; never pays more
order_type = "FAK"              # FAK = partial fills OK, FOK = all or nothing
max_trade_usd = 10.0            # max cost (incl. fee) per trade
max_window_usd = 25.0           # max cost per market window (both sides)
liquidity_memory_s = 10         # size we "took" stays hidden from later fills at that price this long
status_interval_s = 60          # one-line status in `run` mode

[whatif]
# "Would faster orders help?" Extra paper wallets take exactly the same signals
# as the main wallet but fill after these delays. Each starts with its own
# bankroll (large, so cash never runs out and cuts the comparison short) and
# uses the same per-trade and per-window caps as [sim]. 300 ms = the control
# (same delay as the main wallet, same start time as the others).
enabled = true
latencies_ms = [0, 50, 300]
starting_bankroll = 1000.0

[recorder]
interval_s = 1.0                # spot + order-book snapshot for replay
depth = 5                       # book levels per side stored

[archive]
# A folder per day with every trade, signal and skip as spreadsheet (CSV) files,
# plus a per-window table and a summary. Rebuilt from the database; safe to delete.
enabled = true
dir = "data/archive"
interval_min = 15               # refresh today's and yesterday's files this often (and at startup)

[dashboard]
dashboard_host = "127.0.0.1"    # "0.0.0.0" to open it from an iPad on the same wifi
dashboard_port = 8787
timezone = "America/Chicago"
primary_series = "btc-15m"      # market shown first (click the market name to switch)
stale_after_s = 3               # grey out panels whose feed is quiet this long
tick_hz = 4                     # price/book pushes per second (trades and log lines push immediately)
log_lines = 500
signal_window_min = 30

[watch]
print_interval_s = 2
